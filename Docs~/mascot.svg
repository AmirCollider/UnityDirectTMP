<svg class="dt-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Inky, the Unity DirectTMP mascot">
  <title>Inky — Unity DirectTMP</title>
  <desc>A teal inkwell with a brass nib and three glyph bubbles rising out of it: a Latin A, a Japanese hiragana, and an Arabic-script letter.</desc>

  <!-- three glyph bubbles, rising and shrinking -->
  <g class="dt-bubbles">
    <circle cx="23.5" cy="15.5" r="8.8" fill="#FBF6EC" stroke="#1B1725" stroke-width="2.4"/>
    <text x="23.5" y="19.4" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10" font-weight="700" fill="#1B1725">A</text>

    <circle cx="50" cy="9.5" r="7.6" fill="#FBF6EC" stroke="#1B1725" stroke-width="2.2"/>
    <text x="50" y="13.2" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="9" fill="#1B1725">&#12354;</text>

    <circle cx="76" cy="18" r="6.4" fill="#FBF6EC" stroke="#1B1725" stroke-width="2"/>
    <text x="76" y="21.4" text-anchor="middle" font-family="'Vazirmatn', 'Noto Naskh Arabic', serif" font-size="9" fill="#1B1725">&#1587;</text>
  </g>

  <!-- the nib, leaning out of the pot -->
  <g class="dt-nib">
    <path d="M52 59 L79 30" stroke="#1B1725" stroke-width="11" stroke-linecap="round"/>
    <path d="M52 59 L79 30" stroke="#F0A73E" stroke-width="7" stroke-linecap="round"/>
    <path d="M74 35 L84 25 L79 39 Z" fill="#F0A73E" stroke="#1B1725" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="79.5" cy="30.5" r="1.9" fill="#1B1725"/>
  </g>

  <!-- the pot -->
  <path d="M22 55 h56 a9 9 0 0 1 9 9 v14 a9 9 0 0 1 -9 9 h-56 a9 9 0 0 1 -9 -9 v-14 a9 9 0 0 1 9 -9 z"
        fill="#14808C" stroke="#1B1725" stroke-width="3.2" stroke-linejoin="round"/>

  <!-- the label band -->
  <rect x="13" y="66" width="74" height="9" fill="#FBF6EC" opacity="0.94"/>

  <!-- the mouth of the pot, with the ink surface showing through -->
  <ellipse cx="50" cy="53" rx="21.5" ry="6" fill="#0B5A63" stroke="#1B1725" stroke-width="3"/>
  <ellipse cx="50" cy="52" rx="15" ry="3" fill="#14808C" opacity="0.55"/>

  <!-- Inky's face -->
  <circle cx="41" cy="82" r="2.9" fill="#1B1725"/>
  <circle cx="59" cy="82" r="2.9" fill="#1B1725"/>
  <circle cx="40.1" cy="81.1" r="0.95" fill="#FBF6EC"/>
  <circle cx="58.1" cy="81.1" r="0.95" fill="#FBF6EC"/>
  <ellipse cx="33.5" cy="85" rx="3.6" ry="2.4" fill="#E8927C" opacity="0.65"/>
  <ellipse cx="66.5" cy="85" rx="3.6" ry="2.4" fill="#E8927C" opacity="0.65"/>
  <path d="M45.5 86.5 Q50 90.5 54.5 86.5" stroke="#1B1725" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- a drop of ink, because a pen that has just been dipped has one -->
  <path class="dt-drop" d="M12 40 q3.4 5.2 3.4 7.6 a3.4 3.4 0 0 1 -6.8 0 q0 -2.4 3.4 -7.6 z"
        fill="#14808C" stroke="#1B1725" stroke-width="1.8" stroke-linejoin="round"/>
</svg>
